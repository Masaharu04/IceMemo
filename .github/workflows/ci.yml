name: CI

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin ${{ github.event.pull_request.base.ref }} --no-tags

      - name: Install tools
        run: brew install swiftlint swiftformat

      - name: Detect changed Swift files
        id: changed
        run: |
          FILES=$(git diff --name-only origin/${{ github.event.pull_request.base.ref }}..HEAD -- '*.swift')
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: Run SwiftLint
        run: |
          if [ -z "${{ steps.changed.outputs.files }}" ]; then
            echo "No Swift files changed — skipping lint."
            exit 0
          fi
          echo "${{ steps.changed.outputs.files }}" | xargs swiftlint lint --strict

      - name: Run SwiftFormat check
        run: |
          if [ -z "${{ steps.changed.outputs.files }}" ]; then
            echo "No Swift files changed — skipping format check."
            exit 0
          fi
          echo "${{ steps.changed.outputs.files }}" | xargs swiftformat --lint

  build:
    name: Build
    runs-on: macos-26
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "^26.0"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build via Fastlane
        run: bundle exec fastlane ci_build_check
